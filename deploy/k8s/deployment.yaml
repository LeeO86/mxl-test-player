apiVersion: apps/v1
kind: Deployment
metadata:
  name: mxl-test-player
  labels:
    app: mxl-test-player
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mxl-test-player
  template:
    metadata:
      labels:
        app: mxl-test-player
        io.dmf.mxl.revision: "218ddaa0a08c12ffe75fc475ae65aa3d9eef16d7"
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        supplementalGroups: [1000]
      containers:
        - name: player
          image: ghcr.io/leeo86/mxl-test-player:1.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: web
              containerPort: 8130
            - name: nmos
              containerPort: 3282
          env:
            - name: PLAYER_FORMAT
              value: "1080p50"
            - name: PLAYER_OUTPUTS
              value: "2"
            - name: PLAYER_AUDIO_CHANNELS
              value: "16"
            - name: PLAYER_LIBRARY_DIR
              value: /data/library
            - name: CONFIG_DIR
              value: /config
            - name: MXL_DOMAIN_SCAN_PATH
              value: /Volumes/mxl
            - name: MXL_OUTPUT_DOMAIN_DIR
              value: /Volumes/mxl/player
            - name: MXL_CLEANUP_ON_EXIT
              value: "true"
            - name: SHUTDOWN_TIMEOUT_S
              value: "10"
            - name: NMOS_SEED
              value: demo-player
            - name: NMOS_LABEL
              value: Demo player
            - name: NMOS_TAGS
              value: '{"urn:x-srf:production":["demo"],"urn:x-srf:function":["player"]}'
            - name: NMOS_REGISTRY_ADDRESS
              value: nmos-registry.mxl.svc.cluster.local
            - name: NMOS_REGISTRY_PORT
              value: "3210"
            - name: NMOS_QUERY_ADDRESS
              value: nmos-registry.mxl.svc.cluster.local
            - name: NMOS_QUERY_PORT
              value: "3211"
            - name: NMOS_DNS_SD
              value: "false"
            - name: NMOS_HOST_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: WEB_PORT
              value: "8130"
            - name: NMOS_PORT
              value: "3282"
          readinessProbe:
            httpGet:
              path: /readyz
              port: web
          livenessProbe:
            httpGet:
              path: /livez
              port: web
          resources:
            # Starting point for 2x 1080p50. Raise for 2160p or more outputs.
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 16Gi
          volumeMounts:
            - name: mxl
              mountPath: /Volumes/mxl
            - name: library
              mountPath: /data/library
            - name: config
              mountPath: /config
      volumes:
        - name: mxl
          hostPath:
            path: /Volumes/mxl
            type: DirectoryOrCreate
        - name: library
          persistentVolumeClaim:
            claimName: mxl-test-player-library
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mxl-test-player-library
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      # Size for mezzanine media. ProRes 422 HQ 1080p50 is on the order of
      # 100 GB/hour; size the claim for the library you intend to keep.
      storage: 200Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mxl-test-player
spec:
  selector:
    app: mxl-test-player
  ports:
    - name: web
      port: 8130
      targetPort: web
    - name: nmos
      port: 3282
      targetPort: nmos
