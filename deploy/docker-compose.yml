# Lab demo on the pod (bridge) network. The registry is the platform's image
# (mxl-poc-platform versions.yml) with registry.json. Query API is registration port + 1. The player announces
# the first non-loopback IPv4 inside the container unless NMOS_HOST_ADDRESS
# is set to that address.
services:
  # rhastie/nmos-cpp:latest no longer starts ("exec: run: not found").
  registry:
    image: docker.io/gemini2350/nmos-cpp-registry:sha-53481ff@sha256:3c2fa0793ce336e4176487878758efcbd5c61414c5b90433f3758851615f1c91
    environment:
      RUN_MQTT: "FALSE"
      ADVERTISE_MQTT: "FALSE"
    volumes:
      - ./registry.json:/home/registry.json:ro
    ports:
      - "3210:3210"
      - "3211:3211"

  player:
    image: ghcr.io/leeo86/mxl-test-player:1.0.4
    build:
      context: ..
      dockerfile: docker/Dockerfile
    user: "1000:1000"
    ports:
      - "8130:8130"
      - "3282:3282"
    environment:
      PLAYER_FORMAT: "1080p50"
      PLAYER_OUTPUTS: "2"
      PLAYER_AUDIO_CHANNELS: "16"
      PLAYER_LIBRARY_DIR: /data/library
      CONFIG_DIR: /config
      MXL_DOMAIN_SCAN_PATH: /Volumes/mxl
      MXL_OUTPUT_DOMAIN_DIR: /Volumes/mxl/player-demo
      MXL_CLEANUP_ON_EXIT: "false"
      SHUTDOWN_TIMEOUT_S: "10"
      NMOS_SEED: demo-player
      NMOS_LABEL: Demo player
      NMOS_REGISTRY_ADDRESS: registry
      NMOS_REGISTRY_PORT: "3210"
      NMOS_QUERY_ADDRESS: registry
      NMOS_QUERY_PORT: "3211"
      NMOS_DNS_SD: "false"
      WEB_PORT: "8130"
      NMOS_PORT: "3282"
    volumes:
      - mxl:/Volumes/mxl
      - library:/data/library
      - config:/config

volumes:
  # MXL wants a tmpfs; mode 1777 because the player runs as uid 1000.
  mxl:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1g,mode=1777
  library:
  config:
