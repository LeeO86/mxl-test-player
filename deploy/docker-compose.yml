# Lab demo. The registry image is the common nmos-cpp example; the player
# registers when NMOS_REGISTRY_ADDRESS is set. Multiviewer and webrtc-monitor
# are the sibling images from the platform and are optional to start.
services:
  registry:
    image: rhastie/nmos-cpp:latest
    command: ["run"]
    environment:
      RUN_NODE: "false"
      RUN_REGISTRY: "true"
    ports:
      - "3210:3210"

  player:
    image: ghcr.io/leeo86/mxl-test-player:nightly-dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
    network_mode: host
    user: "1000:1000"
    environment:
      PLAYER_FORMAT: "1080p50"
      PLAYER_OUTPUTS: "2"
      PLAYER_AUDIO_CHANNELS: "16"
      PLAYER_LIBRARY_DIR: /data/library
      MXL_OUTPUT_DOMAIN_DIR: /Volumes/mxl/player-demo
      NMOS_REGISTRY_ADDRESS: 127.0.0.1
      NMOS_REGISTRY_PORT: "3210"
      NMOS_DNS_SD: "false"
      WEB_PORT: "8130"
      NMOS_PORT: "3282"
    volumes:
      - mxl:/Volumes/mxl
      - library:/data/library
      - config:/config

  # Optional viewers. Uncomment when those images are available locally.
  # multiviewer:
  #   image: ghcr.io/leeo86/mxl-multiviewer:latest
  # webrtc-monitor:
  #   image: ghcr.io/leeo86/mxl-webrtc-monitor:latest

volumes:
  mxl:
  library:
  config:
